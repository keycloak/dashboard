# Each entry maps to one issue; "resolves" lists "<runId>/*" for a whole run, or "<runId>/<job name>" for a single job.
# Jobs listed here no longer count in "Failed, then green on re-run".
# Whole-run entries ("<runId>/*") appear under the reported failures while the issue is open, and under the resolved failures once it is closed.
# Per-job entries stay in "Recent failed jobs" while the issue is open, and move to the resolved failures once it is closed.
# Entries can be dropped once their runs are no longer part of the logs (about 14 days for retried PRs).
